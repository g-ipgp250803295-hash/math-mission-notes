<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Mission | Learning Notes Navigator</title><style>
:root{--crimson:#45171B;--rose:#A16462;--champagne:#D5BCB5;--paper:#f8efeb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--champagne);color:var(--crimson);font-family:Arial,Helvetica,sans-serif}body{display:flex;justify-content:center;align-items:flex-start}.wrap{width:min(100%,1280px);aspect-ratio:16/9;min-height:650px;padding:26px 35px 17px;display:flex;flex-direction:column}.eyebrow{text-align:center;font-size:11px;letter-spacing:2.2px;font-weight:800}.title{text-align:center;font-family:Georgia,serif;font-size:clamp(25px,3vw,35px);margin:8px 0 5px}.intro{text-align:center;max-width:900px;margin:0 auto 18px;font-size:14px;line-height:1.4}.content{display:grid;grid-template-columns:265px minmax(0,1fr);gap:18px;flex:1;min-height:0}.tabs{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);gap:10px}.tab{border:2px solid var(--rose);border-radius:13px;background:var(--paper);color:var(--crimson);padding:10px 12px;cursor:pointer;text-align:left;font-weight:800;font-size:14px;display:flex;align-items:center;gap:13px;transition:transform .2s,background .2s}.tab:hover{transform:translateX(3px)}.tab[aria-selected=true]{background:var(--crimson);color:#fff5f0;border-color:var(--crimson);box-shadow:0 5px 14px #45171b25}.tab .symbol{font-size:24px;min-width:48px;text-align:center}.panel{background:var(--paper);border:1px solid var(--rose);border-radius:17px;padding:19px 22px;box-shadow:0 6px 18px #45171b12;overflow:auto}.panel h2{font-family:Georgia,serif;font-size:23px;margin:0 0 6px}.tag{display:inline-block;background:var(--champagne);padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700}.story{background:#fffaf7;border-left:4px solid var(--rose);padding:10px 13px;border-radius:8px;line-height:1.4;margin:11px 0;font-size:13px}.equation{font-size:24px;font-weight:800;text-align:center;padding:11px 8px;background:#e8d5ce;border-radius:10px}.steps{display:grid;gap:7px;margin:12px 0}.step{display:flex;align-items:flex-start;gap:10px;line-height:1.35;font-size:13px}.number{background:var(--crimson);color:white;min-width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-weight:700;font-size:12px}.why{border-top:1px solid #d3b5aa;padding-top:10px;line-height:1.4;font-size:13px}.why p{margin:7px 0 0}.footer{text-align:center;font-size:11px;margin-top:12px;opacity:.8}@media(max-width:720px){.wrap{aspect-ratio:auto;min-height:0;padding:22px 14px}.content{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}.tab{min-height:85px;flex-direction:column;justify-content:center;text-align:center;gap:5px;font-size:12px}.tab .symbol{font-size:22px}.panel{padding:17px}.intro{margin-bottom:16px}.footer{margin-bottom:8px}}@media(min-width:721px) and (max-width:1000px){.wrap{min-height:650px;padding:20px}.content{grid-template-columns:225px 1fr}.panel{padding:15px}.story{font-size:12px}.step,.why{font-size:12px}}
</style></head><body><main class="wrap"><div class="eyebrow">✦ MATH MISSION · MISSION BRIEFING ✦</div><h1 class="title">EXPLORE COMBINED OPERATIONS</h1><p class="intro">Choose a detective note to discover how two operations work together. Follow the steps and explain <strong>why</strong> the order matters.</p><div class="content"><div class="tabs" role="tablist" aria-label="Combined operations categories"><button class="tab" role="tab" aria-selected="true" aria-controls="detail" data-index="0"><span class="symbol">＋ ×</span>Addition &amp; Multiplication</button><button class="tab" role="tab" aria-selected="false" aria-controls="detail" data-index="1"><span class="symbol">− ×</span>Subtraction &amp; Multiplication</button><button class="tab" role="tab" aria-selected="false" aria-controls="detail" data-index="2"><span class="symbol">＋ ÷</span>Addition &amp; Division</button><button class="tab" role="tab" aria-selected="false" aria-controls="detail" data-index="3"><span class="symbol">− ÷</span>Subtraction &amp; Division</button></div><section id="detail" class="panel" role="tabpanel" aria-live="polite"></section></div><p class="footer">DETECTIVE TIP ✦ Read the story first. Represent the relationships. Then calculate and verify.</p></main><script>
const notes=[
{title:'Addition & Multiplication',tag:'Multiply first, then add',story:'A school has 3 boxes with 24 pencils in each box. There are also 15 loose pencils. How many pencils are there altogether?',eq:'(3 × 24) + 15 = 87',steps:['Identify the groups: 3 boxes with 24 pencils each.','Multiply to find pencils in boxes: 3 × 24 = 72.','Add the loose pencils: 72 + 15 = 87.'],why:'Multiplication finds the total in the equal groups. Addition then includes the extra 15 pencils.',check:'Verify: 87 − 15 = 72, and 72 ÷ 3 = 24.'},
{title:'Subtraction & Multiplication',tag:'Multiply first, then subtract',story:'A detective has RM200. She buys 4 investigation kits costing RM35 each. How much money remains?',eq:'200 − (4 × 35) = 60',steps:['Identify the budget: RM200. Each of the 4 kits costs RM35.','Multiply to find the total cost: 4 × 35 = RM140.','Subtract the cost from the budget: 200 − 140 = RM60.'],why:'We must calculate the cost of all four kits before finding the remaining money.',check:'Verify: RM60 + RM140 = RM200.'},
{title:'Addition & Division',tag:'Add first, then divide',story:'A library receives 48 storybooks and 24 science books. All the books are shared equally among 6 reading corners. How many books does each corner receive?',eq:'(48 + 24) ÷ 6 = 12',steps:['Identify the two groups of books: 48 and 24.','Add to find the total number of books: 48 + 24 = 72.','Divide equally among 6 corners: 72 ÷ 6 = 12.'],why:'The two groups must be combined before the total can be shared equally. Brackets show that addition happens first.',check:'Verify: 12 × 6 = 72, and 48 + 24 = 72.'},
{title:'Subtraction & Division',tag:'Subtract first, then divide',story:'There are 180 books. The detective places 36 books on display. The remaining books are shared equally among 6 shelves. How many books are on each shelf?',eq:'(180 − 36) ÷ 6 = 24',steps:['Identify the total: 180 books; 36 are set aside for display.','Subtract to find the remaining books: 180 − 36 = 144.','Divide the remainder among 6 shelves: 144 ÷ 6 = 24.'],why:'Only the books that are not on display can be shared among the shelves. Brackets show that subtraction must happen before division.',check:'Verify: (24 × 6) + 36 = 180.'}
];
const panel=document.getElementById('detail'),tabs=[...document.querySelectorAll('.tab')];function show(i){const n=notes[i];tabs.forEach((t,j)=>{t.setAttribute('aria-selected',String(j===i));t.tabIndex=j===i?0:-1});panel.innerHTML=`<h2>${n.title}</h2><span class="tag">${n.tag}</span><div class="story"><strong>Detective Scenario</strong><br>${n.story}</div><div class="equation">${n.eq}</div><div class="steps">${n.steps.map((s,k)=>`<div class="step"><span class="number">${k+1}</span><span>${s}</span></div>`).join('')}</div><div class="why"><strong>Why does this order make sense?</strong><br>${n.why}<p><strong>Check your answer:</strong> ${n.check}</p></div>`}tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(i));t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=(i+(e.key==='ArrowRight'?1:3))%4;show(next);tabs[next].focus()}})});show(0);
</script></body></html>
